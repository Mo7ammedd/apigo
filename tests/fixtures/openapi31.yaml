openapi: 3.1.0
info:
  title: Tasks API
  version: 2.0.0
servers:
  - url: https://{region}.example.com/v2
    variables:
      region:
        default: eu
paths:
  /tasks:
    post:
      operationId: createTask
      tags: [Tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
            examples:
              simple:
                value: {title: Build apigo, completed: false, due: null}
      responses:
        '201':
          description: Created
components:
  schemas:
    Task:
      type: object
      required: [title, completed]
      properties:
        title: {type: string, minLength: 1}
        completed: {type: boolean}
        due: {type: [string, 'null'], format: date}
        priority: {type: integer, enum: [1, 2, 3]}
        children:
          type: array
          items:
            $ref: '#/components/schemas/Task'
